<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baifo IA</title>
  <link rel="icon" href="/favicon.ico" />

  <style>
    :root{
      --bg:#0b0f14;
      --panel:#121821;
      --text:#e6eefc;
      --muted:#98a4ba;
      --border:rgba(255,255,255,.08);
      --accent:#4cc9f0;
      --accent-2:#3a86ff;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}

    html,body{
      height:100%;
      margin:0;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .wrap{
      min-height:100%;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }

    header{
      background:linear-gradient(180deg,rgba(0,0,0,.25),transparent);
      backdrop-filter:blur(6px);
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:16px 20px;
    }

    .logo{
      width:36px;
      height:36px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:grid;
      place-items:center;
      color:#06131d;
      font-weight:900;
    }

    .brand{
      font-weight:700;
    }

    .brand small{
      display:block;
      color:var(--muted);
      font-weight:400;
    }

    main{
      display:grid;
      place-items:center;
      padding:24px;
    }

    #botonBaifo{
      width:min(360px,82vw);
      height:140px;
      border:none;
      border-radius:32px;
      cursor:pointer;
      font-size:24px;
      font-weight:800;
      letter-spacing:.3px;
      transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
      box-shadow:var(--shadow);
    }

    #botonBaifo:hover{
      transform:translateY(-2px);
    }

    #botonBaifo:active{
      transform:scale(.98);
    }

    #botonBaifo.apagado{
      background:linear-gradient(135deg,#2dd4bf,#22c55e);
      color:#04151f;
    }

    #botonBaifo.encendido{
      background:linear-gradient(135deg,#ff4d6d,#ff8fa3);
      color:white;
    }

    #botonBaifo.cargando{
      opacity:.65;
      cursor:wait;
    }

    footer{
      color:var(--muted);
      text-align:center;
      padding:14px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <div class="logo">B</div>
        <div class="brand">
          Baifo IA
          <small>Asistente escolar con voz</small>
        </div>
      </div>
    </header>

    <main>
      <button id="botonBaifo" class="apagado" type="button">
        🎙️ ENCENDER BAIFO
      </button>
    </main>

    <footer>© <span id="year"></span> Baifo</footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const boton = document.getElementById("botonBaifo");
    let activo = false;
    let enviando = false;

    function actualizarBoton(){
      if(activo){
        boton.textContent = "⏹ APAGAR BAIFO";
        boton.classList.remove("apagado");
        boton.classList.add("encendido");
      }else{
        boton.textContent = "🎙️ ENCENDER BAIFO";
        boton.classList.remove("encendido");
        boton.classList.add("apagado");
      }
    }

    async function leerEstado(){
      try{
        const res = await fetch("/baifo/control", {
          method:"GET",
          cache:"no-store"
        });

        if(!res.ok) return;

        const data = await res.json();
        activo = Boolean(data.activo);
        actualizarBoton();
      }catch(error){
        console.error("No se pudo leer el estado de Baifo:", error);
      }
    }

    async function cambiarEstado(){
      if(enviando) return;

      enviando = true;
      boton.classList.add("cargando");

      const nuevoEstado = !activo;

      try{
        const res = await fetch("/baifo/control", {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            activo:nuevoEstado
          })
        });

        if(!res.ok){
          throw new Error(await res.text());
        }

        const data = await res.json();
        activo = Boolean(data.activo);
        actualizarBoton();

      }catch(error){
        console.error("Error cambiando el estado de Baifo:", error);
        alert("No se pudo comunicar con Baifo.");
      }finally{
        enviando = false;
        boton.classList.remove("cargando");
      }
    }

    boton.addEventListener("click", cambiarEstado);

    leerEstado();
  </script>
</body>
</html>
